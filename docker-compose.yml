services:
  oakseerr:
    build: .
    container_name: oakseerr
    ports:
      - "5055:5055"
    volumes:
      - ./data:/app/data
      - ./oakseerr.env:/app/.env:ro
    environment:
      - DATABASE_URL=sqlite:///app/data/oakseerr.db?mode=rwc
      - LISTEN_ADDR=0.0.0.0:5055
    restart: unless-stopped
